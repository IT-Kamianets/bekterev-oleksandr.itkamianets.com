<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — Сторінку не знайдено | Олександр Бектерєв</title>
  <meta name="description" content="Запитувану сторінку не знайдено." />

  <!-- Favicon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔍</text></svg>" />

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(22, 30, 49, 0.75);
      --card-border: rgba(255, 255, 255, 0.08);
      --primary: #6366f1;
      --primary-hover: #4f46e5;
      --primary-glow: rgba(99, 102, 241, 0.25);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --accent: #38bdf8;
      --font-main: 'Plus Jakarta Sans', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: var(--font-main);
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      position: relative;
      overflow: hidden;
      padding: 2rem 1.5rem;
      text-align: center;
    }

    /* Ambient background glows */
    body::before,
    body::after {
      content: "";
      position: fixed;
      width: 450px;
      height: 450px;
      border-radius: 50%;
      pointer-events: none;
      filter: blur(140px);
      opacity: 0.2;
    }

    body::before {
      background: radial-gradient(circle, #6366f1, transparent);
      top: -100px;
      left: -100px;
    }

    body::after {
      background: radial-gradient(circle, #f43f5e, transparent);
      bottom: -100px;
      right: -100px;
    }

    .error-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 3.5rem 2.5rem;
      max-width: 560px;
      width: 100%;
      backdrop-filter: blur(16px);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
      position: relative;
      z-index: 1;
    }

    .error-code {
      font-size: 6.5rem;
      font-weight: 800;
      line-height: 1;
      margin-bottom: 1rem;
      background: linear-gradient(135deg, #6366f1 0%, #38bdf8 50%, #f43f5e 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -0.04em;
    }

    h1 {
      font-size: 1.6rem;
      font-weight: 700;
      margin-bottom: 1rem;
      color: var(--text);
    }

    p {
      color: var(--text-muted);
      font-size: 1.05rem;
      margin-bottom: 2.25rem;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 1rem;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      padding: 0.8rem 1.6rem;
      border-radius: 12px;
      font-weight: 600;
      font-size: 0.95rem;
      text-decoration: none;
      transition: all 0.2s ease;
      cursor: pointer;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      box-shadow: 0 4px 15px var(--primary-glow);
      border: 1px solid transparent;
    }

    .btn-primary:hover {
      background: var(--primary-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.4);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      color: var(--text);
      border: 1px solid var(--card-border);
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      transform: translateY(-2px);
    }

    .footer-note {
      margin-top: 2.5rem;
      font-size: 0.85rem;
      color: rgba(156, 163, 175, 0.6);
    }

    .footer-note a {
      color: var(--text-muted);
      text-decoration: none;
    }

    .footer-note a:hover {
      color: var(--accent);
    }
  </style>
</head>
<body>

  <div class="error-card">
    <div class="error-code">404</div>
    <h1>Сторінку не знайдено</h1>
    <p>
      На жаль, сторінка, яку ви шукаєте, не існує або була переміщена за іншою адресою.
    </p>

    <div class="actions">
      <a href="/" class="btn btn-primary">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        На головну
      </a>
      <a href="https://github.com/artosich" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">
        GitHub
      </a>
    </div>

    <div class="footer-note">
      <a href="https://bekterev-oleksandr.itkamianets.com">bekterev-oleksandr.itkamianets.com</a>
    </div>
  </div>

</body>
</html>
